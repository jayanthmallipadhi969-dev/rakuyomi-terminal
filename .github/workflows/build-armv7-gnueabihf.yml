name: Build armv7-unknown-linux-gnueabihf release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-armv7:
    name: Build armv7 (glibc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross C toolchain (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add rust target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Build workspace release for armv7
        env:
          RUSTFLAGS: "-C codegen-units=1 -C lto=fat -C opt-level=3 -C target-cpu=cortex-a8 -C link-arg=-s"
        run: |
          cargo build --workspace --release --target armv7-unknown-linux-gnueabihf

      - name: Strip ELF binaries
        run: |
          TARGET_DIR=target/armv7-unknown-linux-gnueabihf/release
          if [ -d "$TARGET_DIR" ]; then
            for f in "$TARGET_DIR"/*; do
              if [ -f "$f" ] && file "$f" | grep -q ELF; then
                arm-linux-gnueabihf-strip "$f" || true
              fi
            done
          fi

      - name: List artifacts
        run: ls -lh target/armv7-unknown-linux-gnueabihf/release || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armv7-gnueabihf-release
          path: target/armv7-unknown-linux-gnueabihf/release/
